name: qch

services:
  app:
    build: .
    image: qch-app:latest
    container_name: qch-app
    restart: unless-stopped
    # 与宿主机 ubuntu(uid 1000) 同 uid，保证挂载卷可写；容器内无 root
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 128
    # 只绑定宿主机回环地址，公网流量一律经 nginx 反代
    ports:
      - "127.0.0.1:8765:8765"
    env_file:
      - /etc/qch-bot/env
    environment:
      HOST: 0.0.0.0
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    volumes:
      - ./data:/app/data
      - ./assets/audio/cache:/app/assets/audio/cache
      - ./tools/whisper-model-small:/app/tools/whisper-model-small:ro
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: qch-redis
    restart: unless-stopped
    # 直接以 redis 用户(uid 999)运行，跳过 entrypoint 的 setpriv 降权（cap_drop ALL 下无 setuid 能力）
    user: "999:999"
    # 仅 compose 内网可达，不发布任何端口；带密码 + 内存上限
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "224mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 320m
    pids_limit: 64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

volumes:
  redis-data:
